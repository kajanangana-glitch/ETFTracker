<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global ETF Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1;--panel:#fff;--ink:#1b1d1f;--muted:#6b6f75;--line:#e4e2dc;
  --up:#1a7f4b;--down:#c23b2e;--flat:#8a8f96;--accent:#2b5bd7;--chip:#efede7;
  --up-bg:rgba(26,127,75,.12);--down-bg:rgba(194,59,46,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111315;--panel:#181b1e;--ink:#e8e9ea;--muted:#9097a0;--line:#2a2e33;
  --up:#3fbf7f;--down:#ef6a5b;--flat:#7d838a;--accent:#7aa2ff;--chip:#22262a;
  --up-bg:rgba(63,191,127,.14);--down-bg:rgba(239,106,91,.14);}}
:root[data-theme="dark"]{
  --bg:#111315;--panel:#181b1e;--ink:#e8e9ea;--muted:#9097a0;--line:#2a2e33;
  --up:#3fbf7f;--down:#ef6a5b;--flat:#7d838a;--accent:#7aa2ff;--chip:#22262a;
  --up-bg:rgba(63,191,127,.14);--down-bg:rgba(239,106,91,.14);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:inherit}
header{padding:20px 24px 12px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;padding:5px 10px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
input[type=search]{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);width:160px}
section{min-width:0}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:20px 24px 40px;max-width:1500px;margin:0 auto}
@media (max-width:1000px){main{grid-template-columns:minmax(0,1fr);padding:16px}header{padding:16px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{margin:0 0 12px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat .k{font-size:12px;color:var(--muted)}.stat .v{font-size:20px;font-weight:600;margin-top:2px}.stat .d{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin-bottom:20px}
.tile{border-radius:8px;padding:8px 10px;cursor:pointer;border:1px solid transparent;transition:transform .1s}
.tile:hover{transform:translateY(-1px);border-color:var(--line)}
.tile .t{font-weight:600;font-size:13px}.tile .n{font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .p{font-size:13px;margin-top:4px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none;font-size:12px}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th.sorted{color:var(--ink)}
td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--chip)}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;font-weight:500}
.b-Uptrend{background:var(--up-bg);color:var(--up)}.b-Downtrend{background:var(--down-bg);color:var(--down)}.b-Mixed,.b-n\/a{background:var(--chip);color:var(--muted)}
.grp{font-size:11px;color:var(--muted)}
aside{display:flex;flex-direction:column;gap:20px;min-width:0}
.ev{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.ev:last-child{border:0}
.ev .dt{min-width:46px;text-align:center}.ev .dd{font-size:18px;font-weight:600;line-height:1}.ev .mm{font-size:11px;color:var(--muted);text-transform:uppercase}
.ev .in{font-size:11px;color:var(--muted)}
.tag{font-size:10.5px;background:var(--chip);color:var(--muted);padding:1px 6px;border-radius:4px;margin-right:4px}
.news{list-style:none;margin:0;padding:0}
.news li{padding:9px 0;border-bottom:1px solid var(--line)}.news li:last-child{border:0}
.news a{text-decoration:none;font-weight:500;line-height:1.35}.news a:hover{color:var(--accent)}
.meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.pol{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.filters{display:flex;gap:6px;margin-bottom:8px}
#drawer{position:fixed;inset:0;display:none;z-index:10}
#drawer.open{display:block}
#drawer .bg{position:absolute;inset:0;background:rgba(0,0,0,.35)}
#drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(620px,100%);background:var(--panel);overflow-y:auto;padding:20px 22px;border-left:1px solid var(--line)}
.x{float:right;border:0;background:var(--chip);color:var(--ink);border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.kv div{background:var(--chip);border-radius:8px;padding:8px 10px}.kv .k{font-size:11px;color:var(--muted)}.kv .v{font-weight:600}
svg text{fill:var(--muted);font:10px "IBM Plex Mono",monospace}
.empty{padding:40px;text-align:center;color:var(--muted)}
.view{background:var(--ink)}.view button{color:var(--bg);opacity:.7}.view button.on{opacity:1;color:var(--ink)}
.evcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.evc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.evc.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.evc .cd{font-size:22px;font-weight:600}.evc .cd small{font-size:12px;font-weight:400;color:var(--muted)}
.evc .tt{font-weight:600;margin-top:2px}.evc .sm{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font:500 11.5px "IBM Plex Mono",monospace;padding:2px 7px;border-radius:5px;background:var(--chip);margin:4px 4px 0 0}
.chips button{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 12.5px "IBM Plex Mono",monospace;padding:4px 10px;border-radius:7px;cursor:pointer;margin-right:6px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{font-size:14px;line-height:1.55;margin:4px 0 14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.drv{margin:0;padding-left:18px}.drv li{margin:6px 0;line-height:1.4}
.drv.b li::marker{color:var(--up)}.drv.s li::marker{color:var(--down)}
.mb{margin-bottom:20px}.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.ev.click{cursor:pointer}.ev.click:hover .ttl{color:var(--accent)}
footer{grid-column:1/-1;color:var(--muted);font-size:11.5px;text-align:center}
</style>
</head>
<body>
<header>
  <div>
    <h1>Global ETF Tracker</h1>
    <div class="sub" id="updated">Loading…</div>
  </div>
  <div class="controls">
    <div class="seg view" id="viewSeg"></div>
    <div class="seg mk" id="groupSeg"></div>
    <div class="seg mk" id="periodSeg"></div>
    <input class="mk" type="search" id="q" placeholder="Filter ticker / name">
  </div>
</header>

<main>
  <section id="polView" hidden>
    <div class="evcards" id="evCards"></div>
    <div id="evDetail"></div>
  </section>
  <section id="mktView">
    <div class="stats" id="stats"></div>
    <div class="card" style="margin-bottom:20px">
      <h2 id="heatTitle">Performance map</h2>
      <div class="heat" id="heat"></div>
    </div>
    <div class="card">
      <h2>Watchlist</h2>
      <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    </div>
  </section>
  <aside>
    <div class="card"><h2>Upcoming</h2><div id="events"></div></div>
    <div class="card"><h2>Global &amp; political headlines</h2><ul class="news" id="macro"></ul></div>
    <div class="card">
      <h2>Latest ETF news</h2>
      <div class="filters seg" id="newsSeg"></div>
      <ul class="news" id="feed"></ul>
    </div>
  </aside>
  <footer>Prices: Yahoo Finance via yfinance · News: Google News RSS · Tone is a simple headline keyword score, not advice.</footer>
</main>

<div id="drawer"><div class="bg"></div><div class="panel" id="detail"></div></div>

<script>
const PERIODS={chg_1d:"1D",chg_1w:"1W",chg_1m:"1M",chg_3m:"3M",chg_ytd:"YTD",chg_1y:"1Y"};
const S={data:null,view:location.hash==="#politics"?"pol":"mkt",ev:null,evEtf:null,group:"All",period:"chg_1m",q:"",sort:"chg_1m",dir:-1,newsFilter:"All"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cls=v=>v==null?"flat":v>0?"up":v<0?"down":"flat";
const fmt=(v,d=2,s="%")=>v==null?"—":(v>0?"+":"")+v.toFixed(d)+s;
const ago=iso=>{if(!iso)return"";const h=(Date.now()-new Date(iso))/36e5;return h<1?"just now":h<24?Math.round(h)+"h ago":Math.round(h/24)+"d ago"};
const toneDot=t=>`<span class="dot" title="headline tone ${t}" style="background:var(--${t>0?"up":t<0?"down":"flat"})"></span>`;

function seg(el,opts,cur,on){el.innerHTML=opts.map(([v,l])=>`<button data-v="${esc(v)}" class="${v===cur?"on":""}">${esc(l)}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest("button");if(b)on(b.dataset.v)}}

function rows(){const q=S.q.toLowerCase();
  return S.data.etfs.filter(e=>(S.group==="All"||e.group===S.group)&&(!q||e.ticker.toLowerCase().includes(q)||e.name.toLowerCase().includes(q)))}

function heatColor(v){if(v==null)return"var(--chip)";const a=Math.min(Math.abs(v)/(S.period==="chg_1d"?2:S.period==="chg_1w"?4:S.period==="chg_1m"?8:15),1);
  return v>=0?`rgba(26,160,90,${.12+a*.6})`:`rgba(210,60,45,${.12+a*.6})`}

function spark(hist,w=90,h=24){if(!hist||hist.length<2)return"";const v=hist.map(x=>x[1]),mn=Math.min(...v),mx=Math.max(...v);
  const pts=v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-2-(y-mn)/(mx-mn||1)*(h-4)).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="var(--${v.at(-1)>=v[0]?"up":"down"})" stroke-width="1.4" points="${pts}"/></svg>`}

function renderStats(r){const ok=r.filter(e=>e[S.period]!=null);if(!ok.length){$("stats").innerHTML="";return}
  const best=ok.reduce((a,b)=>b[S.period]>a[S.period]?b:a),worst=ok.reduce((a,b)=>b[S.period]<a[S.period]?b:a);
  const up=r.filter(e=>e.trend==="Uptrend").length,avg=ok.reduce((s,e)=>s+e[S.period],0)/ok.length;
  const tone=r.reduce((s,e)=>s+(e.news_tone||0),0)/(r.length||1);
  $("stats").innerHTML=[
    ["Best "+PERIODS[S.period],best.ticker,`<span class="up">${fmt(best[S.period])}</span> · ${esc(best.name)}`],
    ["Worst "+PERIODS[S.period],worst.ticker,`<span class="down">${fmt(worst[S.period])}</span> · ${esc(worst.name)}`],
    ["Average "+PERIODS[S.period],`<span class="${cls(avg)}">${fmt(avg)}</span>`,`${ok.length} ETFs`],
    ["In uptrend",`${up}/${r.length}`,`news tone ${toneDot(tone)} ${tone>0.2?"positive":tone<-0.2?"negative":"neutral"}`]
  ].map(([k,v,d])=>`<div class="card stat"><div class="k">${k}</div><div class="v mono">${v}</div><div class="d">${d}</div></div>`).join("")}

function renderHeat(r){$("heatTitle").textContent=`Performance map · ${PERIODS[S.period]}`;
  $("heat").innerHTML=[...r].sort((a,b)=>(b[S.period]??-1e9)-(a[S.period]??-1e9)).map(e=>
  `<div class="tile" data-t="${e.ticker}" style="background:${heatColor(e[S.period])}"><div class="t">${e.ticker}</div><div class="n">${esc(e.name)}</div><div class="p mono">${fmt(e[S.period])}</div></div>`).join("")}

const COLS=[["ticker","Ticker"],["name","Name"],["price","Price"],["chg_1d","1D"],["chg_1w","1W"],["chg_1m","1M"],["chg_3m","3M"],["chg_ytd","YTD"],["trend","Trend"],["rsi14","RSI"],["off_52w_high","vs 52w hi"],["spark","6M"],["news_tone","News"]];
function renderTable(r){
  $("tbl").tHead.innerHTML="<tr>"+COLS.map(([k,l])=>`<th data-k="${k}" class="${S.sort===k?"sorted":""}">${l}${S.sort===k?(S.dir>0?" ↑":" ↓"):""}</th>`).join("")+"</tr>";
  const s=[...r].sort((a,b)=>{const x=a[S.sort],y=b[S.sort];if(x==null)return 1;if(y==null)return -1;return(typeof x==="string"?x.localeCompare(y):x-y)*S.dir});
  $("tbl").tBodies[0].innerHTML=s.map(e=>e.error&&e.price==null?`<tr data-t="${e.ticker}"><td><b>${e.ticker}</b></td><td>${esc(e.name)}</td><td colspan="11" class="flat" style="text-align:left">no price data this run</td></tr>`:
  `<tr data-t="${e.ticker}"><td><b>${e.ticker}</b></td><td>${esc(e.name)} <span class="grp">${esc(e.group)}</span></td>
   <td class="mono">${e.price?.toFixed(2)??"—"}</td>
   ${["chg_1d","chg_1w","chg_1m","chg_3m","chg_ytd"].map(k=>`<td class="mono ${cls(e[k])}">${fmt(e[k])}</td>`).join("")}
   <td><span class="badge b-${e.trend}">${e.trend}</span></td>
   <td class="mono ${e.rsi14>70?"down":e.rsi14<30?"up":""}" title="${e.rsi14>70?"overbought":e.rsi14<30?"oversold":""}">${e.rsi14??"—"}</td>
   <td class="mono ${cls(e.off_52w_high)}">${fmt(e.off_52w_high,1)}</td>
   <td>${spark(e.history)}</td><td>${toneDot(e.news_tone)} <span class="mono flat">${e.news?.length||0}</span></td></tr>`).join("");
  $("tbl").tHead.onclick=ev=>{const th=ev.target.closest("th");if(!th||th.dataset.k==="spark")return;const k=th.dataset.k;
    S.dir=S.sort===k?-S.dir:(k==="ticker"||k==="name"?1:-1);S.sort=k;renderTable(rows())}}

function newsItem(n,showTicker){return `<li><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>
  <div class="meta">${toneDot(n.tone)}${showTicker&&n.ticker?`<b>${n.ticker}</b>`:""}<span>${esc(n.source)}</span><span>${ago(n.published)}</span>${n.political?'<span class="pol">political</span>':""}</div></li>`}

function renderSide(){const d=S.data;
  $("events").innerHTML=d.events.length?d.events.map(ev=>{const dt=new Date(ev.date+"T12:00:00"),days=Math.ceil((dt-Date.now())/864e5);
    return `<div class="ev ${ev.event_id?"click":""}" ${ev.event_id?`data-ev-open="${ev.event_id}"`:""}><div class="dt"><div class="dd">${dt.getDate()}</div><div class="mm">${dt.toLocaleString("en",{month:"short"})}</div></div>
    <div><div class="ttl">${esc(ev.title)}</div><div class="in">${days<=0?"today":"in "+days+" day"+(days>1?"s":"")} ${ev.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}${(ev.etfs||[]).slice(0,4).map(t=>`<span class="tag mono">${t}</span>`).join("")}</div></div></div>`}).join(""):'<div class="flat">No upcoming events — add some in etfs.yml</div>';
  $("macro").innerHTML=(d.macro_news||[]).slice(0,10).map(n=>newsItem(n,false)).join("")||'<li class="flat">No headlines</li>';
  seg($("newsSeg"),[["All","All"],["political","Political"],["pos","Positive"],["neg","Negative"]],S.newsFilter,v=>{S.newsFilter=v;renderSide()});
  const ids=new Set(rows().map(e=>e.ticker));
  const f=d.news_feed.filter(n=>ids.has(n.ticker)&&(S.newsFilter==="All"||(S.newsFilter==="political"&&n.political)||(S.newsFilter==="pos"&&n.tone>0)||(S.newsFilter==="neg"&&n.tone<0)));
  $("feed").innerHTML=f.slice(0,25).map(n=>newsItem(n,true)).join("")||'<li class="flat">No matching headlines</li>'}

function chart(e){const h=e.history||[];if(h.length<2)return"";const W=570,H=220,P=34,v=h.map(x=>x[1]);
  const sma=n=>v.map((_,i)=>i<n-1?null:v.slice(i-n+1,i+1).reduce((a,b)=>a+b)/n);const s20=sma(20),s50=sma(50);
  const all=v.concat(s50.filter(x=>x)),mn=Math.min(...all),mx=Math.max(...all);
  const X=i=>P+i/(v.length-1)*(W-P-6),Y=y=>8+(mx-y)/(mx-mn||1)*(H-28);
  const line=(arr,c,w,dash="")=>`<polyline fill="none" stroke="${c}" stroke-width="${w}" ${dash} points="${arr.map((y,i)=>y==null?"":X(i).toFixed(1)+","+Y(y).toFixed(1)).filter(Boolean).join(" ")}"/>`;
  const ticks=[mn,(mn+mx)/2,mx].map(y=>`<text x="0" y="${Y(y)+3}">${y.toFixed(1)}</text><line x1="${P}" x2="${W}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)"/>`).join("");
  const xt=[0,Math.floor(v.length/2),v.length-1].map(i=>`<text x="${X(i)}" y="${H-4}" text-anchor="${i?i===v.length-1?"end":"middle":"start"}">${h[i][0].slice(5)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${ticks}${xt}${line(s50,"var(--muted)",1,'stroke-dasharray="4 3"')}${line(s20,"var(--accent)",1)}${line(v,"var(--ink)",1.6)}</svg>
  <div class="meta"><span>— price</span><span style="color:var(--accent)">— 20-day avg</span><span>- - 50-day avg</span></div>`}

function openDetail(t){const e=S.data.etfs.find(x=>x.ticker===t);if(!e)return;
  $("detail").innerHTML=`<button class="x" onclick="closeDetail()">×</button>
  <div class="grp">${esc(e.group)}</div><h1 style="margin:2px 0">${e.ticker} · ${esc(e.name)}</h1>
  <div class="mono" style="font-size:22px;margin-top:6px">${e.price?.toFixed(2)??"—"} <span class="${cls(e.chg_1d)}" style="font-size:15px">${fmt(e.chg_1d)} today</span></div>
  ${chart(e)}
  <div class="kv">${[["1 week",fmt(e.chg_1w)],["1 month",fmt(e.chg_1m)],["3 months",fmt(e.chg_3m)],["YTD",fmt(e.chg_ytd)],["1 year",fmt(e.chg_1y)],["vs 52w high",fmt(e.off_52w_high,1)],
    ["50-day avg",e.sma50??"—"],["200-day avg",e.sma200??"—"],["RSI(14)",e.rsi14??"—"],["Trend",e.trend],["Momentum",fmt(e.momentum,1,"")],["Ex-dividend",e.ex_dividend??"—"]]
    .map(([k,v])=>`<div><div class="k">${k}</div><div class="v mono">${v}</div></div>`).join("")}</div>
  ${(S.data.political||[]).filter(p=>p.etfs.includes(e.ticker)).map(p=>`<div class="card ev click" style="margin-bottom:12px;padding:10px 14px" data-ev-open="${p.id}"><div><div class="ttl"><b>${esc(p.title)}</b> · ${daysTo(p.date)>0?"in "+daysTo(p.date)+" days":"recent"} →</div><div class="in">See how ${e.ticker} moved around past elections</div></div></div>`).join("")}
  <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">News</h2>
  <ul class="news">${(e.news||[]).map(n=>newsItem(n,false)).join("")||'<li class="flat">No recent headlines</li>'}</ul>
  <p class="meta"><a href="https://finance.yahoo.com/quote/${e.ticker}" target="_blank" rel="noopener">Open on Yahoo Finance ↗</a></p>`;
  $("drawer").classList.add("open")}
function closeDetail(){$("drawer").classList.remove("open")}

/* ---------- Political events view ---------- */
const CYC=["#7c5cd6","#d4892a","#2a9cb3","#c4577f","#5f9e3a"];
const daysTo=iso=>Math.ceil((new Date(iso+"T12:00:00")-Date.now())/864e5);
const bdays=(a,b)=>{let n=0,d=new Date(a+"T12:00:00"),e=new Date(b+"T12:00:00"),s=d<e?1:-1;while(d.toDateString()!==e.toDateString()){d.setDate(d.getDate()+s);const w=d.getDay();if(w&&w<6)n+=s}return n};
function countdown(iso){const d=daysTo(iso);return d>0?`${d}<small> days</small>`:d===0?"Today":`<small>${-d} days ago</small>`}

function renderEvCards(){const P=S.data.political||[];
  $("evCards").innerHTML=P.map(e=>`<button class="evc ${e.id===S.ev?"on":""}" data-ev="${e.id}">
    <div class="cd mono">${countdown(e.date)}</div><div class="tt">${esc(e.title)}</div>
    <div class="sm">${new Date(e.date+"T12:00:00").toLocaleDateString("en",{day:"numeric",month:"short",year:"numeric"})}</div>
    <div>${e.etfs.map(t=>`<span class="chip">${t}</span>`).join("")}</div></button>`).join("")||'<div class="card empty">No events — add some in politics.yml</div>'}

function cycleChart(ev,t){const cy=ev.cycles?.[t];if(!cy)return'<div class="flat">No price history for this ETF.</div>';
  const [x0,x1]=S.data.cycle_window||[-90,60],W=660,H=290,L=40,R=12,T=14,B=28;
  const series=cy.past.filter(p=>p.points?.length).map((p,i)=>({...p,color:CYC[i%CYC.length],w:1.4}));
  const cur=cy.current?.points?.length?{label:"This cycle (2026)",points:cy.current.points,color:"var(--ink)",w:2.6}:null;
  const all=[...series,cur].filter(Boolean).flatMap(s=>s.points.map(p=>p[1]));if(!all.length)return'<div class="flat">Not enough history yet.</div>';
  let mn=Math.min(...all),mx=Math.max(...all);const pad=(mx-mn)*.06;mn-=pad;mx+=pad;
  const X=o=>L+(o-x0)/(x1-x0)*(W-L-R),Y=v=>T+(mx-v)/(mx-mn)*(H-T-B);
  const path=s=>`<polyline fill="none" stroke="${s.color}" stroke-width="${s.w}" stroke-linejoin="round" points="${s.points.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}"/>`;
  const step=(mx-mn)>40?20:(mx-mn)>20?10:5,yt=[];for(let v=Math.ceil(mn/step)*step;v<=mx;v+=step)yt.push(v);
  const grid=yt.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${v===100?'stroke-dasharray="2 3" stroke="var(--muted)"':""}/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`).join("");
  const xt=[x0,-60,-30,0,30,x1].map(o=>`<text x="${X(o)}" y="${H-10}" text-anchor="middle">${o>0?"+"+o:o}</text>`).join("");
  const ms=(ev.milestones||[]).map(m=>({...m,o:-bdays(m.date,ev.date)})).filter(m=>m.o>x0&&m.o<x1&&m.o!==0)
    .map(m=>`<line x1="${X(m.o)}" x2="${X(m.o)}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="2 3"/><text x="${X(m.o)+(m.o>x1-25?-4:4)}" y="${T+20}" text-anchor="${m.o>x1-25?"end":"start"}">${esc(m.label)}</text>`).join("");
  const now=cur?cur.points.at(-1):null;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${t} price around election day, this cycle vs past cycles">${grid}${xt}
    <line x1="${X(0)}" x2="${X(0)}" y1="${T}" y2="${H-B}" stroke="var(--accent)" stroke-width="1.2"/><text x="${X(0)+4}" y="${T+8}" style="fill:var(--accent)">Election day</text>${ms}
    ${series.map(path).join("")}${cur?path(cur):""}
    ${now?`<circle cx="${X(now[0])}" cy="${Y(now[1])}" r="4" fill="var(--ink)"/><text x="${X(now[0])+7}" y="${Y(now[1])-6}" style="fill:var(--ink);font-weight:500">today</text>`:""}</svg>
  <div class="legend">${cur?`<span><i style="background:var(--ink);height:4px"></i>This cycle</span>`:""}${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("")}</div>
  <p class="hint">Price rebased to 100 at ${-x0} trading days before the vote. X-axis = trading days from election day.${cy.current&&!cur&&cy.current.days_to_go?` This cycle starts in ${cy.current.days_to_go-(-x0)} sessions.`:""}</p>`}

function cycleTable(ev,t){const cy=ev.cycles?.[t];if(!cy)return"";const cur=cy.current?.points;
  const sofar=cur?.length?+(cur.at(-1)[1]-100).toFixed(2):null;
  const rowsH=cy.past.filter(p=>p.points?.length).map((p,i)=>`<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${CYC[i%CYC.length]};margin-right:6px"></i>${esc(p.label)}</td>
    ${["run_up","reaction","week_after","after"].map(k=>`<td class="mono ${cls(p[k])}">${fmt(p[k],1)}</td>`).join("")}</tr>`).join("");
  return `<div class="tablewrap"><table><thead><tr><th>Cycle</th><th title="${-S.data.cycle_window[0]} trading days into the vote">Run-up</th><th title="first session after the vote">Day after</th><th>Week after</th><th title="${S.data.cycle_window[1]} trading days after">3 mo. after</th></tr></thead>
  <tbody>${cur?.length?`<tr><td><b>2026 so far</b> <span class="grp">(day ${cur.at(-1)[0]})</span></td><td class="mono ${cls(sofar)}"><b>${fmt(sofar,1)}</b></td><td class="flat">—</td><td class="flat">—</td><td class="flat">—</td></tr>`:""}${rowsH}</tbody></table></div>`}

function pollChart(ev,t){const P=ev.polls;if(!P?.rows?.length)return"";const etf=S.data.etfs.find(e=>e.ticker===t);
  const start=P.rows[0].date,end=[ev.date,new Date().toISOString().slice(0,10)].sort().at(-1);
  const tx=d=>new Date(d+"T12:00:00").getTime(),t0=tx(start),t1=tx(end);
  const W=660,H=260,L=36,R=48,T=14,B=28,X=d=>L+(tx(d)-t0)/(t1-t0)*(W-L-R);
  const vals=P.rows.flatMap(r=>[r.a,r.b]),pm=Math.floor(Math.min(...vals)-2),pM=Math.ceil(Math.max(...vals)+2),Y=v=>T+(pM-v)/(pM-pm)*(H-T-B);
  const px=(etf?.history||[]).filter(h=>h[0]>=start);let priceLine="",pAxis="";
  if(px.length>1){const a=Math.min(...px.map(p=>p[1])),b=Math.max(...px.map(p=>p[1])),Yp=v=>T+(b-v)/(b-a||1)*(H-T-B);
    priceLine=`<polyline fill="none" stroke="var(--muted)" stroke-width="1.3" opacity=".7" points="${px.map(p=>X(p[0]).toFixed(1)+","+Yp(p[1]).toFixed(1)).join(" ")}"/>`;
    pAxis=[a,(a+b)/2,b].map(v=>`<text x="${W-R+6}" y="${Yp(v)+3}">${v.toFixed(1)}</text>`).join("")}
  const avg=k=>P.rows.filter(r=>!r.actual).map((r,i,arr)=>{const w=arr.slice(Math.max(0,i-4),i+1);return[r.date,w.reduce((s,x)=>s+x[k],0)/w.length]});
  const C=["#2f6fd6","#d4762a"];
  const line=(pts,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2.2" points="${pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}"/>`;
  const dots=(k,c)=>P.rows.map(r=>r.actual?`<rect x="${X(r.date)-5}" y="${Y(r[k])-5}" width="10" height="10" transform="rotate(45 ${X(r.date)} ${Y(r[k])})" fill="${c}" stroke="var(--panel)"><title>${esc(r.src)}: ${r[k]}%</title></rect>`
    :`<circle cx="${X(r.date)}" cy="${Y(r[k])}" r="2.6" fill="${c}" opacity=".45"><title>${esc(r.src)} ${r.date}: ${r[k]}%</title></circle>`).join("");
  const yt=[];for(let v=Math.ceil(pm/2)*2;v<=pM;v+=2)yt.push(v);
  const months=[];{const d=new Date(start+"T12:00:00");d.setDate(1);d.setMonth(d.getMonth()+1);while(tx(d.toISOString().slice(0,10))<=t1){months.push(d.toISOString().slice(0,10));d.setMonth(d.getMonth()+1)}}
  const evx=X(ev.date);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Polls vs ${t} price">
    ${yt.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v}%</text>`).join("")}
    ${months.map(m=>`<text x="${X(m)}" y="${H-10}" text-anchor="middle">${new Date(m+"T12:00:00").toLocaleString("en",{month:"short"})}</text>`).join("")}
    ${pAxis}${priceLine}
    <line x1="${evx}" x2="${evx}" y1="${T}" y2="${H-B}" stroke="var(--accent)"/><text x="${evx-4}" y="${T+8}" text-anchor="end" style="fill:var(--accent)">${esc(ev.title.split(" ").at(-1))}</text>
    ${dots("a",C[0])}${dots("b",C[1])}${line(avg("a"),C[0])}${line(avg("b"),C[1])}</svg>
  <div class="legend"><span><i style="background:${C[0]}"></i>${esc(P.labels[0])} (5-poll avg)</span><span><i style="background:${C[1]}"></i>${esc(P.labels[1])} (5-poll avg)</span><span>◆ actual result</span><span><i style="background:var(--muted)"></i>${t} price (right axis)</span></div>
  <p class="hint">${esc(P.note)}</p>`}

function renderEvDetail(){const ev=(S.data.political||[]).find(e=>e.id===S.ev);if(!ev){$("evDetail").innerHTML="";return}
  if(!ev.etfs.includes(S.evEtf))S.evEtf=ev.etfs[0];const t=S.evEtf,etf=S.data.etfs.find(e=>e.ticker===t);
  $("evDetail").innerHTML=`
  <div class="card mb"><div class="grp">${esc(ev.country)} · ${new Date(ev.date+"T12:00:00").toLocaleDateString("en",{weekday:"short",day:"numeric",month:"long",year:"numeric"})}</div>
    <h1 style="margin:2px 0 6px">${esc(ev.title)}</h1><p class="status">${esc(ev.status||"")}</p>
    <div class="chips" id="evEtfs">${ev.etfs.map(x=>`<button data-etf="${x}" class="${x===t?"on":""}">${x}</button>`).join("")}
    ${etf?`<span class="meta" style="display:inline-flex">${esc(etf.name)} · <span class="mono">${etf.price?.toFixed(2)??"—"}</span> <span class="mono ${cls(etf.chg_1d)}">${fmt(etf.chg_1d)} today</span> <span class="mono ${cls(etf.chg_1m)}">${fmt(etf.chg_1m)} 1M</span> <a href="#" data-t="${t}">details</a></span>`:""}</div></div>
  <div class="card mb"><h2>How ${t} moved around past elections vs this cycle</h2>${cycleChart(ev,t)}</div>
  <div class="card mb"><h2>Past cycles in numbers</h2>${cycleTable(ev,t)}</div>
  ${ev.polls?`<div class="card mb"><h2>Polls vs ${t}</h2>${pollChart(ev,t)}</div>`:""}
  <div class="grid2 mb"><div class="card"><h2 class="up" style="color:var(--up)">What tends to push it higher</h2><ul class="drv b">${(ev.drivers?.bullish||[]).map(d=>`<li>${esc(d)}</li>`).join("")}</ul></div>
    <div class="card"><h2 style="color:var(--down)">What tends to push it lower</h2><ul class="drv s">${(ev.drivers?.bearish||[]).map(d=>`<li>${esc(d)}</li>`).join("")}</ul></div></div>
  <div class="card"><h2>Election news</h2><ul class="news">${(ev.news||[]).map(n=>newsItem(n,false)).join("")||'<li class="flat">No recent headlines</li>'}</ul></div>`;
  $("evEtfs").onclick=e=>{const b=e.target.closest("[data-etf]");if(b){S.evEtf=b.dataset.etf;renderEvDetail()}}}

function showEvent(id){S.view="pol";S.ev=id;closeDetail();render();window.scrollTo({top:0,behavior:"smooth"})}
$("evCards").onclick=e=>{const b=e.target.closest("[data-ev]");if(b){S.ev=b.dataset.ev;renderEvCards();renderEvDetail()}};

function render(){const r=rows();
  seg($("viewSeg"),[["mkt","Markets"],["pol","Political events"]],S.view,v=>{S.view=v;render()});
  const pol=S.view==="pol";$("polView").hidden=!pol;$("mktView").hidden=pol;document.querySelectorAll(".mk").forEach(el=>el.style.display=pol?"none":"");
  if(pol){if(!S.ev)S.ev=S.data.political?.[0]?.id;renderEvCards();renderEvDetail()}
  seg($("groupSeg"),[["All","All"],...S.data.groups.map(g=>[g,g])],S.group,v=>{S.group=v;render()});
  seg($("periodSeg"),Object.entries(PERIODS),S.period,v=>{S.period=v;S.sort=v;S.dir=-1;render()});
  renderStats(r);renderHeat(r);renderTable(r);renderSide()}

document.addEventListener("click",e=>{const o=e.target.closest("[data-ev-open]");if(o){e.preventDefault();showEvent(o.dataset.evOpen);return}
  const t=e.target.closest("[data-t]");if(t){e.preventDefault();openDetail(t.dataset.t)}});
$("drawer").querySelector(".bg").onclick=closeDetail;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});
$("q").oninput=e=>{S.q=e.target.value;render()};

fetch("data.json?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{S.data=d;
  $("updated").textContent=`Updated ${new Date(d.generated_at).toLocaleString()} · ${d.etfs.length} ETFs · refreshes every weekday`;render()})
 .catch(()=>{$("updated").textContent="No data yet";document.querySelector("main").innerHTML='<div class="card empty" style="grid-column:1/-1">No data.json yet — run the “Update ETF data” workflow in the repo’s Actions tab.</div>'});
</script>
</body>

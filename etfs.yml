# Upcoming macro / political events shown in the "Upcoming" panel.
# Past dates are hidden automatically — add your own (elections, central banks, summits).
events:
  - { date: 2026-10-28, title: "FOMC rate decision (US Fed)", tags: [US, Rates] }
  - { date: 2026-12-09, title: "FOMC rate decision + projections (US Fed)", tags: [US, Rates] }
  - { date: 2026-10-21, title: "Bank Indonesia rate decision", tags: [Indonesia, Rates] }
